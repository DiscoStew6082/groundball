<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1650" viewBox="0 0 2400 1650" role="img" aria-labelledby="title desc">
  <title id="title">Baseball RAG Architecture Pathway Map</title>
  <desc id="desc">A non-linear architecture map showing Baseball RAG as a set of branching and rejoining pathways around request lifecycle, routing, evidence, UI, tracing, and verification.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#29445a"/>
    </marker>
    <marker id="softArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="136%">
      <feDropShadow dx="0" dy="10" stdDeviation="11" flood-color="#14213d" flood-opacity="0.16"/>
    </filter>
    <style>
      .bg { fill: #f7faf9; }
      .title { fill: #17324d; font: 700 56px Arial, sans-serif; letter-spacing: 0; }
      .subtitle { fill: #4b6478; font: 26px Arial, sans-serif; letter-spacing: 0; }
      .section { fill: #17324d; font: 700 25px Arial, sans-serif; letter-spacing: 0; text-transform: uppercase; }
      .node { fill: #fff; stroke: #b7c8d7; stroke-width: 3; rx: 20; filter: url(#shadow); }
      .hub { fill: #17324d; stroke: #17324d; stroke-width: 3; rx: 28; filter: url(#shadow); }
      .router { fill: #e7f2ff; stroke: #7caed7; stroke-width: 4; rx: 28; filter: url(#shadow); }
      .duck { fill: #e9f7ef; stroke: #76b689; stroke-width: 3; rx: 20; filter: url(#shadow); }
      .llm { fill: #fff5dc; stroke: #d2a64a; stroke-width: 3; rx: 20; filter: url(#shadow); }
      .risk { fill: #fff0f0; stroke: #d17b7b; stroke-width: 3; rx: 20; filter: url(#shadow); }
      .ops { fill: #f1ecff; stroke: #9a86d8; stroke-width: 3; rx: 20; filter: url(#shadow); }
      .label { fill: #1e3346; font: 700 25px Arial, sans-serif; letter-spacing: 0; }
      .labelLight { fill: #fff; font: 700 27px Arial, sans-serif; letter-spacing: 0; }
      .body { fill: #41576a; font: 20px Arial, sans-serif; letter-spacing: 0; }
      .bodyLight { fill: #dcecff; font: 20px Arial, sans-serif; letter-spacing: 0; }
      .small { fill: #597084; font: 18px Arial, sans-serif; letter-spacing: 0; }
      .path { fill: none; stroke: #29445a; stroke-width: 5; marker-end: url(#arrow); }
      .softPath { fill: none; stroke: #64748b; stroke-width: 3.5; marker-end: url(#softArrow); stroke-dasharray: 9 9; }
      .returnPath { fill: none; stroke: #2f6f4e; stroke-width: 5; marker-end: url(#arrow); }
      .tracePath { fill: none; stroke: #7c66c4; stroke-width: 4; marker-end: url(#softArrow); stroke-dasharray: 12 8; }
      .boundary { fill: none; stroke: #d5e0e8; stroke-width: 3; stroke-dasharray: 16 12; rx: 34; }
      .badge { fill: #17324d; rx: 16; }
      .badgeText { fill: #fff; font: 700 18px Arial, sans-serif; letter-spacing: 0; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="2400" height="1650"/>
  <text class="title" x="90" y="92">Baseball RAG Architecture Pathway Map</text>
  <text class="subtitle" x="92" y="136">Not a pipeline: a routed evidence system with branching answer paths, shared provenance, UI state, tracing, and verification loops.</text>

  <rect class="boundary" x="58" y="174" width="2284" height="1376"/>
  <text class="section" x="90" y="214">Runtime graph</text>

  <!-- Entry surfaces -->
  <rect class="hub" x="102" y="274" width="355" height="135"/>
  <text class="labelLight" x="134" y="323">User Surfaces</text>
  <text class="bodyLight" x="134" y="359">Gradio Query tab</text>
  <text class="bodyLight" x="134" y="386">HTTP API and CLI adapters</text>

  <rect class="node" x="102" y="470" width="355" height="135"/>
  <text class="label" x="134" y="519">Output Surfaces</text>
  <text class="body" x="134" y="555">chat, rows, source JSON</text>
  <text class="body" x="134" y="582">SQL, warnings, review payloads</text>

  <!-- Core hub -->
  <rect class="hub" x="855" y="250" width="430" height="160"/>
  <text class="labelLight" x="896" y="306">RequestExecution</text>
  <text class="bodyLight" x="896" y="342">execute_request(...)</text>
  <text class="bodyLight" x="896" y="370">trace ownership, metadata, governance</text>

  <rect class="risk" x="855" y="455" width="430" height="120"/>
  <text class="label" x="896" y="504">Fail-Closed Policy</text>
  <text class="body" x="896" y="540">unsupported, ambiguous, live-data limits</text>

  <rect class="router" x="855" y="635" width="430" height="175"/>
  <text class="label" x="896" y="690">Routing Switchboard</text>
  <text class="body" x="896" y="726">deterministic precedence first</text>
  <text class="body" x="896" y="754">LLM route fallback when allowed</text>
  <text class="body" x="896" y="782">typed route decisions</text>

  <path class="path" d="M 457 342 C 610 320 715 314 855 330"/>
  <path class="path" d="M 1070 410 L 1070 455"/>
  <path class="path" d="M 1070 575 L 1070 635"/>

  <!-- Answer path clusters -->
  <text class="section" x="1510" y="214">Answer path clusters</text>

  <rect class="duck" x="1435" y="270" width="380" height="150"/>
  <text class="label" x="1472" y="318">stat_query</text>
  <text class="body" x="1472" y="354">QueryScopeOutcome</text>
  <text class="body" x="1472" y="382">StatQueryPlanningOutcome</text>
  <text class="body" x="1472" y="410">DuckDB stat plan</text>

  <rect class="duck" x="1888" y="270" width="380" height="150"/>
  <text class="label" x="1925" y="318">grounded_database_question</text>
  <text class="body" x="1925" y="354">template catalog</text>
  <text class="body" x="1925" y="382">validated parameterized SQL</text>
  <text class="body" x="1925" y="410">DuckDB grounded runtime</text>

  <rect class="llm" x="1435" y="905" width="380" height="155"/>
  <text class="label" x="1472" y="953">player_biography</text>
  <text class="body" x="1472" y="989">DuckDB player identity</text>
  <text class="body" x="1472" y="1017">LLM JSON contract</text>
  <text class="body" x="1472" y="1045">claim verification</text>

  <rect class="llm" x="1888" y="905" width="380" height="155"/>
  <text class="label" x="1925" y="953">general_explanation</text>
  <text class="body" x="1925" y="989">local stat definitions</text>
  <text class="body" x="1925" y="1017">LLM prose when allowed</text>
  <text class="body" x="1925" y="1045">explicit unavailable fallback</text>

  <path class="path" d="M 1285 695 C 1380 605 1438 470 1540 420"/>
  <path class="path" d="M 1285 715 C 1490 580 1740 445 1888 385"/>
  <path class="path" d="M 1285 750 C 1420 800 1488 860 1548 905"/>
  <path class="path" d="M 1285 773 C 1525 830 1740 865 1888 950"/>

  <!-- Authority and evidence mesh -->
  <text class="section" x="670" y="925">Evidence authorities and shared read models</text>

  <rect class="duck" x="652" y="960" width="380" height="140"/>
  <text class="label" x="690" y="1008">DuckDB / Lahman</text>
  <text class="body" x="690" y="1044">primary structured authority</text>
  <text class="body" x="690" y="1072">stats, people, manifest coverage</text>

  <rect class="ops" x="652" y="1155" width="380" height="140"/>
  <text class="label" x="690" y="1203">Retrosheet</text>
  <text class="body" x="690" y="1239">optional secondary consensus</text>
  <text class="body" x="690" y="1267">biography stat claims only</text>

  <rect class="node" x="1135" y="1050" width="380" height="155"/>
  <text class="label" x="1173" y="1098">Verified Evidence</text>
  <text class="body" x="1173" y="1134">claim rows, SQL, warnings</text>
  <text class="body" x="1173" y="1162">source authority catalog</text>
  <text class="body" x="1173" y="1190">narration guard input</text>

  <path class="softPath" d="M 1435 360 C 1215 455 965 750 842 960"/>
  <path class="softPath" d="M 1888 383 C 1615 460 1088 750 842 960"/>
  <path class="softPath" d="M 1435 980 C 1270 995 1120 1018 1032 1030"/>
  <path class="softPath" d="M 1435 1018 C 1230 1090 1120 1160 1032 1225"/>
  <path class="path" d="M 1032 1030 L 1135 1115"/>
  <path class="path" d="M 1032 1225 C 1082 1205 1108 1180 1135 1150"/>

  <!-- Shared response assembly -->
  <rect class="node" x="855" y="1350" width="430" height="130"/>
  <text class="label" x="896" y="1398">StructuredAnswer</text>
  <text class="body" x="896" y="1434">answer text, intent, rows, sources</text>
  <text class="body" x="896" y="1462">SQL, metadata, warnings</text>

  <rect class="node" x="365" y="1328" width="365" height="130"/>
  <text class="label" x="397" y="1376">Visible Evidence Adapter</text>
  <text class="body" x="397" y="1412">AnswerPresenter</text>
  <text class="body" x="397" y="1440">Dataframe, JSON, SQL panes</text>

  <rect class="node" x="102" y="1118" width="355" height="145"/>
  <text class="label" x="134" y="1166">Query Tab Wiring</text>
  <text class="body" x="134" y="1202">pending / completed / stale</text>
  <text class="body" x="134" y="1230">session hash and latest turn</text>

  <path class="returnPath" d="M 1625 420 C 1510 610 1390 1070 1285 1358"/>
  <path class="returnPath" d="M 2078 420 C 1830 665 1545 1040 1285 1390"/>
  <path class="returnPath" d="M 1625 1060 C 1508 1170 1390 1285 1285 1408"/>
  <path class="returnPath" d="M 2078 1060 C 1810 1240 1510 1350 1285 1428"/>
  <path class="returnPath" d="M 1325 1205 C 1260 1265 1235 1315 1205 1350"/>
  <path class="returnPath" d="M 855 1415 L 730 1395"/>
  <path class="returnPath" d="M 365 1393 C 260 1340 235 1270 260 1263"/>
  <path class="returnPath" d="M 280 1118 C 250 930 248 720 280 605"/>

  <!-- Architecture and operations loops -->
  <text class="section" x="88" y="790">Side loops</text>

  <rect class="ops" x="102" y="825" width="355" height="145"/>
  <text class="label" x="134" y="873">Architecture Explorer</text>
  <text class="body" x="134" y="909">ArchitectureTracePublisher</text>
  <text class="body" x="134" y="937">record or animate latest path</text>

  <rect class="ops" x="520" y="725" width="285" height="120"/>
  <text class="label" x="552" y="773">LatestRunStore</text>
  <text class="body" x="552" y="809">per-session read model</text>

  <rect class="risk" x="520" y="515" width="285" height="120"/>
  <text class="label" x="552" y="563">Human Review</text>
  <text class="body" x="552" y="599">unsupported API cases</text>

  <rect class="ops" x="1888" y="1245" width="380" height="145"/>
  <text class="label" x="1925" y="1293">Verification Gates</text>
  <text class="body" x="1925" y="1329">ruff, mypy, pytest, evals</text>
  <text class="body" x="1925" y="1357">health and coverage reports</text>

  <path class="tracePath" d="M 1070 410 C 918 510 737 610 805 725"/>
  <path class="tracePath" d="M 805 785 C 690 820 575 860 457 900"/>
  <path class="tracePath" d="M 457 897 C 390 1030 360 1110 300 1118"/>
  <path class="tracePath" d="M 1285 330 C 1550 1130 1720 1240 1888 1308"/>

  <!-- Legends -->
  <rect class="node" x="1508" y="1138" width="760" height="70"/>
  <rect class="badge" x="1540" y="1160" width="112" height="32"/>
  <text class="badgeText" x="1560" y="1182">green</text>
  <text class="small" x="1670" y="1182">Primary structured authority and deterministic evidence</text>
  <rect class="badge" x="1955" y="1160" width="112" height="32" fill="#7c66c4"/>
  <text class="badgeText" x="1975" y="1182">purple</text>
  <text class="small" x="2085" y="1182">Observability and operational loops</text>

  <rect class="node" x="1508" y="1220" width="300" height="60"/>
  <text class="small" x="1538" y="1256">Dashed paths are supporting evidence, trace, or governance flows.</text>
</svg>
