[project]
name = "groundball"
version = "0.1.0"
description = "Groundball application — query MLB history with natural language"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "duckdb",
    "typer",
    "fastapi",
    "uvicorn[standard]>=0.24.0",
    "unidecode>=1.4.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "httpx",
    "types-pyyaml>=6.0.12.20260508",
    "types-requests>=2.33.0.20260508",
]

[project.scripts]
groundball = "baseball_rag.cli:main"
groundball-ui = "baseball_rag.web_app:dev_main"
baseball-rag = "baseball_rag.cli:main"
baseball-rag-ui = "baseball_rag.web_app:dev_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/baseball_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "unit: fast, mocked tests — no external services required",
    "integration: requires live services (LM Studio, web app, etc.)",
    "slow: long-running or heavy setup (full pipeline runs, ingestion)",
    "llm: calls the LLM via LM Studio — excluded from unit CI job",
]

[tool.coverage.run]
source = ["src/baseball_rag"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
