[project]
name = "groundball"
version = "0.1.0"
description = "Groundball application — query MLB history with natural language"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "duckdb",
    "fastapi",
    "pydantic",
    "starlette",
    "uvicorn[standard]>=0.24.0",
    "unidecode>=1.4.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "httpx2>=2.0.0",
    "types-pyyaml>=6.0.12.20260508",
    "types-requests>=2.33.0.20260508",
]

[project.scripts]
groundball = "baseball_rag.cli:main"
groundball-ui = "baseball_rag.web_app:dev_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/baseball_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "error::DeprecationWarning",
    "error::PendingDeprecationWarning",
    "error::FutureWarning",
    "error::starlette.exceptions.StarletteDeprecationWarning",
]
markers = [
    "release_proof: exhaustive release-only verification excluded from fast CI",
]

[tool.coverage.run]
source = ["src/baseball_rag"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
