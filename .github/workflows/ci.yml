name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install ruff && ruff check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install mypy types-requests types-PyYAML
      - run: mypy src/baseball_rag/

  test:
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      # Install all dependencies (prod + dev) directly via pip — avoids uv venv PATH issues
      - run: pip install pytest pytest-cov coverage requests duckdb typer fastapi gradio httpx mypy types-requests types-PyYAML ruff
      - run: pip install -e .
      # Download NeuML/baseballdata CSVs (runtime deps — not stored in repo)
      - run: python -c "from baseball_rag.db.download import download_all; download_all()"
      - run: python -m pytest tests/ -m "not llm" --cov=baseball_rag --cov-report=xml --cov-report=term-missing -v
      - name: Deterministic eval release gate
        run: python -m evals.questions --report eval-report.md --guardrail-report guardrail-coverage.md --json-report eval-report.json --baseline evals/baseline.json
      - name: Publish reliability summary
        if: always()
        run: |
          {
            echo "## Deterministic Eval Report"
            cat eval-report.md
            echo
            echo "## Guardrail Coverage Report"
            cat guardrail-coverage.md
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deterministic-reliability-reports
          path: |
            eval-report.md
            eval-report.json
            guardrail-coverage.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
      - uses: codecov/codecov-action@v6
        continue-on-error: true
