name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
      - name: Check root Python lock
        run: uv lock --check
      - name: Audit locked Python dependencies
        run: |
          tmpreq="$(mktemp)"
          trap 'rm -f "$tmpreq"' EXIT
          uv export --frozen --format requirements-txt --no-emit-project --all-extras --all-groups > "$tmpreq"
          uvx pip-audit --progress-spinner off --no-deps --disable-pip -r "$tmpreq"
      - name: Check nested Python lock
        run: uv lock --check
        working-directory: src/mlb_api_mcp
      - name: Audit nested locked Python dependencies
        run: |
          tmpreq="$(mktemp)"
          trap 'rm -f "$tmpreq"' EXIT
          uv export --frozen --format requirements-txt --no-emit-project --all-extras --all-groups > "$tmpreq"
          uvx pip-audit --progress-spinner off --no-deps --disable-pip -r "$tmpreq"
        working-directory: src/mlb_api_mcp
      - name: Audit web dependencies
        run: npm audit --audit-level=low
        working-directory: web

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run ruff check src/ tests/ evals/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run mypy src/baseball_rag/

  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test ./...

  web-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web

  test:
    runs-on: ubuntu-latest
    needs: [security, lint, typecheck, web-test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev
      # Download NeuML/baseballdata CSVs (runtime deps — not stored in repo)
      - run: uv run python -c "from baseball_rag.db.download import download_all; download_all()"
      - run: uv run python -m pytest tests/ -m "not llm" --cov=baseball_rag --cov-report=xml --cov-report=term-missing -v
      - name: Deterministic eval release gate
        run: uv run python -m evals.questions --report eval-report.md --guardrail-report guardrail-coverage.md --json-report eval-report.json --baseline evals/baseline.json
      - name: Publish reliability summary
        if: always()
        run: |
          {
            echo "## Deterministic Eval Report"
            cat eval-report.md
            echo
            echo "## Guardrail Coverage Report"
            cat guardrail-coverage.md
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: deterministic-reliability-reports
          path: |
            eval-report.md
            eval-report.json
            guardrail-coverage.md
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
      - uses: codecov/codecov-action@v7
        continue-on-error: true
