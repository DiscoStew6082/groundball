name: CI

on:
  push:
    branches:
      - main
      - implementation/**
  pull_request:
    branches:
      - main

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
      - name: Check root Python lock
        run: uv lock --check
      - name: Audit locked Python dependencies
        run: |
          tmpreq="$(mktemp)"
          trap 'rm -f "$tmpreq"' EXIT
          uv export --frozen --format requirements-txt --no-emit-project --all-extras --all-groups > "$tmpreq"
          uvx pip-audit --progress-spinner off --no-deps --disable-pip -r "$tmpreq"
      - name: Check nested Python lock
        run: uv lock --check
        working-directory: src/mlb_api_mcp
      - name: Audit nested locked Python dependencies
        run: |
          tmpreq="$(mktemp)"
          trap 'rm -f "$tmpreq"' EXIT
          uv export --frozen --format requirements-txt --no-emit-project --all-extras --all-groups > "$tmpreq"
          uvx pip-audit --progress-spinner off --no-deps --disable-pip -r "$tmpreq"
        working-directory: src/mlb_api_mcp
      - name: Audit web dependencies
        run: npm audit --audit-level=low
        working-directory: web

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run ruff check src/ tests/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run mypy src/baseball_rag/

  web-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web

  test:
    runs-on: ubuntu-latest
    needs: [security, lint, typecheck, web-test]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev
      # Materialize the legacy local-test inputs; the release image uses only release/bundle.
      - run: uv run python -c "from baseball_rag.db.download import download_all; download_all()"
      - name: Verify immutable Release Bundle
        run: |
          release_source_commit="$(python -c 'import json; print(json.load(open("release/bundle/release-manifest.json"))["source_commit"])')"
          uv run python -m baseball_rag.release_bundle check release/bundle \
            --expected-source-commit "$release_source_commit"
      - name: Verify release branch source and artifact commit topology
        if: github.ref == 'refs/heads/implementation/public-deterministic-groundball'
        run: |
          release_source_commit="$(python -c 'import json; print(json.load(open("release/bundle/release-manifest.json"))["source_commit"])')"
          test "$(git rev-parse HEAD^)" = "$release_source_commit"
          test -z "$(git diff --name-only HEAD^ HEAD | grep -Ev '^release/bundle/' || true)"
      - name: Fast Python test suite
        run: >-
          uv run python -m pytest tests/
          -m "not llm and not release_proof"
          --cov=baseball_rag
          --cov-report=xml
          --cov-report=term-missing
          --durations=20
          -v
      - name: Validate checked-in query coverage proof
        run: uv run python -m baseball_rag.coverage_proof_validator
      - name: Query Plan and Query Run eval matrix
        run: uv run python -m baseball_rag.query.eval_matrix --json-report query-eval-report.json
      - name: Publish query proof summary
        if: always()
        run: cat src/baseball_rag/query/coverage/coverage-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: deterministic-query-reports
          path: |
            query-eval-report.json
            src/baseball_rag/query/coverage/coverage-report.json
            src/baseball_rag/query/coverage/coverage-report.md
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
      - uses: codecov/codecov-action@v7
        continue-on-error: true

  release-container:
    runs-on: ubuntu-latest
    needs: [test]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/implementation/public-deterministic-groundball'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build the immutable public release image
        run: |
          release_source_commit="$(git rev-parse HEAD^)"
          test "$(python -c 'import json; print(json.load(open("release/bundle/release-manifest.json"))["source_commit"])')" = "$release_source_commit"
          test -z "$(git diff --name-only HEAD^ HEAD | grep -Ev '^release/bundle/' || true)"
          docker build -f Dockerfile.vercel \
            --build-arg GROUNDBALL_SOURCE_COMMIT="$release_source_commit" \
            -t "groundball-public-release:${GITHUB_SHA}" .
      - name: Prove network-disabled application cold boot and release behavior
        run: |
          container_name="groundball-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker run --detach --network none --name "$container_name" \
            "groundball-public-release:${GITHUB_SHA}"
          trap 'docker rm --force "$container_name" >/dev/null' EXIT
          ready=0
          for _attempt in $(seq 1 30); do
            if docker exec "$container_name" /app/.venv/bin/python -c \
              'import urllib.request; urllib.request.urlopen("http://127.0.0.1/health", timeout=1).read()'
            then
              ready=1
              break
            fi
            sleep 1
          done
          if test "$ready" != 1; then
            docker logs "$container_name"
            exit 1
          fi
          docker exec "$container_name" /app/.venv/bin/python -c \
            'import json, urllib.request; get = lambda path: json.load(urllib.request.urlopen("http://127.0.0.1" + path)); post = lambda path, question: json.load(urllib.request.urlopen(urllib.request.Request("http://127.0.0.1" + path, data=json.dumps({"question": question}).encode(), headers={"Content-Type": "application/json"}))); ready = get("/api/release-readiness"); capabilities = get("/api/capabilities"); answer = post("/api/query-runs", "who had the most RBIs in 1962"); retro = post("/api/retrosheet/queries", "how many times did Nolan Ryan strike out the side in his career"); assert ready["duckdb"]["database"] == ":memory:"; assert answer["rows"] == [{"player.name": "Tommy Davis", "season": 1962, "batting.RBI": 153}]; assert [item["capability_id"] for item in capabilities["retrosheet_capabilities"]] == ["pitcher_strikeout_side"]; assert retro["rows"][0]["career_strikeout_side_count"] == 324; print(ready["release_bundle_digest"])'
          docker exec "$container_name" /bin/sh -c \
            'test ! -e /app/src/baseball_rag/db/download.py && test ! -e /app/src/baseball_rag/db/generate_retrosheet_team_reference.py && test ! -e /app/src/baseball_rag/db/secondary_sources/retrosheet.py && test ! -e /app/src/baseball_rag/db/secondary_sources/retrosheet_database.py && test ! -e /app/src/baseball_rag/db/secondary_sources/retrosheet_events.py && test ! -e /app/src/baseball_rag/generation/llm.py && test ! -e /app/src/baseball_rag/query/catalog && test ! -e /app/src/baseball_rag/query/coverage && test -z "$(find /app -type f \( -name "*.duckdb" -o -name "*.zip" -o -name "coverage-report.md" \) -print -quit)" && test -z "$(find /app/release-bundle -iname "*cache*" -print -quit)"'
