name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
      - run: uv lock --check
      - name: Audit locked Python dependencies
        run: |
          tmpreq="$(mktemp)"
          trap 'rm -f "$tmpreq"' EXIT
          uv export --frozen --format requirements-txt --no-emit-project --extra dev > "$tmpreq"
          uvx pip-audit --progress-spinner off --no-deps --disable-pip -r "$tmpreq"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run ruff check src/ tests/ evals/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run mypy src/baseball_rag/

  test:
    runs-on: ubuntu-latest
    needs: [security, lint, typecheck]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev
      # Download NeuML/baseballdata CSVs (runtime deps — not stored in repo)
      - run: uv run python -c "from baseball_rag.db.download import download_all; download_all()"
      - run: uv run python -m pytest tests/ -m "not llm" --cov=baseball_rag --cov-report=xml --cov-report=term-missing -v
      - name: Deterministic eval release gate
        run: uv run python -m evals.questions --report eval-report.md --guardrail-report guardrail-coverage.md --json-report eval-report.json --baseline evals/baseline.json
      - name: Publish reliability summary
        if: always()
        run: |
          {
            echo "## Deterministic Eval Report"
            cat eval-report.md
            echo
            echo "## Guardrail Coverage Report"
            cat guardrail-coverage.md
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deterministic-reliability-reports
          path: |
            eval-report.md
            eval-report.json
            guardrail-coverage.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
      - uses: codecov/codecov-action@v6
        continue-on-error: true
